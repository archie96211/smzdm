[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smzdm-agent-tools"
version = "0.1.0"
description = "MCP server and Agent Skill for Haojia Radar"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3", "httpx>=0.27,<1", "pydantic>=2.4,<3"]

[project.scripts]
smzdm-mcp = "smzdm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smzdm_mcp"]

[dependency-groups]
dev = ["pytest>=8,<10"]
