name: smzdm
services:
  monitor:
    build: .
    image: smzdm-headless:local
    restart: unless-stopped
    init: true
    ports:
      - "${SMZDM_BIND_IP:-127.0.0.1}:${SMZDM_PORT:-18085}:18080"
    environment:
      SMZDM_ALLOWED_NETWORKS: "${SMZDM_ALLOWED_NETWORKS:-192.168.31.0/24}"
      SMZDM_MONITOR_CONCURRENCY: "1"
      SMZDM_IMAGE_SERVER_HOST: "${SMZDM_BIND_IP:-127.0.0.1}"
      SMZDM_IMAGE_SERVER_PORT: "${SMZDM_PORT:-18085}"
      SMZDM_AUTO_START_DELAY: "1"
    volumes:
      - monitor-data:/data
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.50
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
    stop_grace_period: 30s
volumes:
  monitor-data:
