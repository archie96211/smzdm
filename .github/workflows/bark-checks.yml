name: Bark checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install backend and test dependencies
        run: |
          python - <<'PY'
          import subprocess, sys
          names = {'fastapi', 'aiohttp', 'pydantic', 'cryptography'}
          requirements = [line.strip() for line in open('requirements.txt') if line.split('==')[0] in names]
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *requirements, 'httpx==0.27.2'])
          PY
      - run: python -m compileall -q desktop_app.py start.py src
      - run: python -m unittest discover -s tests -p '*checks.py' -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed frontend bundle
        run: git diff --exit-code -- static && test -z "$(git ls-files --others --exclude-standard static)"
